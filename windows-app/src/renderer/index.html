<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나만의 캘린더</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="summary-card">
        <div class="summary-header">
          <span style="display: inline-flex; align-items: center; gap: 6px;"><svg class="icon-svg spark-svg" style="color: #f59e0b; width: 15px; height: 15px;" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 2a1 1 0 011 1v1h1a1 1 0 010 2H6v1a1 1 0 01-2 0V6H3a1 1 0 010-2h1V3a1 1 0 011-1zm6 3a1 1 0 011 1v2h2a1 1 0 110 2h-2v2a1 1 0 11-2 0v-2H8a1 1 0 110-2h2V6a1 1 0 011-1zm-4 9a1 1 0 011 1v1h1a1 1 0 110 2H8v1a1 1 0 11-2 0v-1H5a1 1 0 110-2h1v-1a1 1 0 011-1z" clip-rule="evenodd"/></svg> 오늘의 요약</span>
          <span id="todayHolidayBadge" class="holiday-tag" style="display: none;"></span>
        </div>
        <div class="summary-stats">
          <div class="stat-box">
            <span class="stat-label">남은 일정</span>
            <span id="statRemainingEvents" class="stat-value">0건</span>
          </div>
          <div class="stat-box">
            <span class="stat-label">마감 할 일</span>
            <span id="statDueTodos" class="stat-value">0건</span>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs-segmented">
        <button class="tab-btn active" data-tab="today">오늘</button>
        <button class="tab-btn" data-tab="week">이번 주</button>
        <button class="tab-btn" data-tab="month">이번 달</button>
        <button class="tab-btn" data-tab="memo">메모</button>
      </div>

      <!-- Quick Add (hidden in memo tab) -->
      <div id="sidebarNormalContainer" style="display: flex; flex-direction: column; flex: 1; overflow: hidden;">
        <div class="quick-add-bar">
          <input type="text" id="quickAddInput" class="quick-input" placeholder="오늘 할 일 추가 (Enter)">
          <button id="btnOpenNewTodoModal" class="btn-add-detail" title="상세 입력">+</button>
        </div>

        <!-- Capsule Cards Scroll -->
        <div id="cardsList" class="cards-scroll-view">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Memo Container -->
      <div id="sidebarMemoContainer" style="display: none; flex-direction: column; flex: 1; overflow: hidden;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span style="font-size: 12px; font-weight: bold; color: var(--text-muted);">스티커 메모</span>
          <button id="btnMainAddNewMemo" class="btn-primary" style="padding: 4px 10px; font-size: 11px;">+ 새 메모</button>
        </div>
        <div id="mainMemoList" class="cards-scroll-view">
          <!-- Sticky notes rendered dynamically -->
        </div>
      </div>
    </aside>

    <!-- Main View -->
    <main class="main-view">
      <header class="top-navbar">
        <div class="nav-title-group">
          <button id="btnNavToday" class="nav-btn">오늘</button>
          <button id="btnNavPrev" class="nav-btn">&lt;</button>
          <button id="btnNavNext" class="nav-btn">&gt;</button>
          <span id="calendarTitle" class="nav-title">2026년 11월</span>
        </div>

        <div class="nav-action-group" style="display: flex; gap: 8px; align-items: center;">
          <button id="btnSwitchToMini" class="nav-btn" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--primary-color);">
            <svg class="icon-svg board-svg" style="width: 14px; height: 14px;" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h12a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6z"/></svg>
            미니 보드
          </button>
          <button id="btnOpenNewEventModal" class="btn-primary" style="padding: 6px 12px; font-size: 13px;">+ 새 일정</button>
          <div class="view-switchers">
            <button class="view-btn active" data-view="month">월간</button>
            <button class="view-btn" data-view="week">주간</button>
            <button class="view-btn" data-view="day">일간</button>
          </div>
        </div>
      </header>

      <!-- AI Smart Bar -->
      <div class="ai-quick-add-bar" style="display: flex; gap: 8px; align-items: center; padding: 6px 14px; background: rgba(147, 51, 234, 0.08); border-bottom: 1px solid rgba(147, 51, 234, 0.18);">
        <span style="font-size: 14px; color: #9333ea;">✨</span>
        <input type="text" id="aiQuickInput" class="form-input" style="flex: 1; padding: 5px 10px; font-size: 12px; border: 1px solid rgba(147, 51, 234, 0.3);" placeholder="🤖 AI 스마트 일정 등록 (예: 내일 오후 3시 기획팀 회의, 폴더는 C:\Work)">
        <button id="btnAiQuickSubmit" class="btn-primary" style="background: #9333ea; padding: 5px 12px; font-size: 12px; white-space: nowrap;">AI 등록</button>
      </div>

      <!-- Month Container -->
      <div id="monthViewContainer" class="month-container">
        <div class="weekday-header-row">
          <div class="weekday-col sun">일</div>
          <div class="weekday-col">월</div>
          <div class="weekday-col">화</div>
          <div class="weekday-col">수</div>
          <div class="weekday-col">목</div>
          <div class="weekday-col">금</div>
          <div class="weekday-col sat">토</div>
        </div>
        <div id="monthGrid" class="month-days-grid">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </main>
  </div>

  <!-- Event Editor Modal -->
  <div id="eventModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="eventModalTitle">새 일정 등록</h3>
        <button id="btnCloseEventModal" style="background: none; border: none; font-size: 18px; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">일정 제목</label>
          <input type="text" id="eventTitleInput" class="form-input" placeholder="회의, 외근 등 일정 제목 입력">
        </div>

        <div class="form-group">
          <label class="form-label">기간 유형</label>
          <select id="eventPeriodTypeSelect" class="form-input">
            <option value="timed">시간 지정</option>
            <option value="allDay">하루 종일</option>
            <option value="thisWeek">이번 주 동안</option>
            <option value="thisMonth">이번 달 동안</option>
          </select>
        </div>

        <div id="eventTimeGroup" class="form-group" style="display: flex; flex-direction: row; gap: 8px;">
          <div style="flex: 1;">
            <label class="form-label">시작 시간</label>
            <input type="time" id="eventStartTimeInput" class="form-input" value="10:00">
          </div>
          <div style="flex: 1;">
            <label class="form-label">종료 시간</label>
            <input type="time" id="eventEndTimeInput" class="form-input" value="11:00">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">반복 설정</label>
          <select id="eventRecurrenceSelect" class="form-input">
            <option value="none">반복 없음</option>
            <option value="daily">매일</option>
            <option value="weekdays">주중 (월~금)</option>
            <option value="weekly">매주</option>
            <option value="biweekly">격주 (2주)</option>
            <option value="monthly">매월</option>
            <option value="yearly">매년</option>
          </select>
        </div>

        <!-- Project Folder Connection -->
        <div class="form-group">
          <label class="form-label">연결된 프로젝트 폴더 (Finder/탐색기 바로가기)</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="eventFolderPathInput" class="form-input" style="flex: 1;" placeholder="연결된 폴더 없음" readonly>
            <button id="btnAiEventFolderBrief" class="btn-primary" style="background: #9333ea; padding: 6px 10px; font-size: 11px; white-space: nowrap; display: none;">🤖 AI 브리핑</button>
            <button id="btnChooseEventFolder" class="nav-btn" style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;">
              <svg class="icon-svg folder-svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
              폴더 선택
            </button>
            <button id="btnClearEventFolder" style="border: none; background: none; color: #ef4444; font-size: 16px; cursor: pointer;">&times;</button>
          </div>
          <div id="aiBriefBox" style="display: none; margin-top: 6px; padding: 8px 10px; background: rgba(147, 51, 234, 0.08); border-radius: 6px; font-size: 12px; color: var(--text-color); line-height: 1.4;"></div>
        </div>

        <div class="form-group">
          <label class="form-label">메모</label>
          <textarea id="eventNotesInput" class="form-input" rows="2" placeholder="메모 입력"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnDeleteEvent" class="nav-btn" style="color: #ef4444; display: none;">삭제</button>
        <button id="btnSaveEvent" class="btn-primary" style="margin-left: auto;">저장</button>
      </div>
    </div>
  </div>

  <!-- Todo Editor Modal -->
  <div id="todoModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="todoModalTitle">할 일 등록</h3>
        <button id="btnCloseTodoModal" style="background: none; border: none; font-size: 18px; cursor: pointer;">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">할 일 제목</label>
          <input type="text" id="todoTitleInput" class="form-input" placeholder="할 일 제목 입력">
        </div>

        <div class="form-group">
          <label class="form-label">범위</label>
          <select id="todoScopeSelect" class="form-input">
            <option value="today">오늘</option>
            <option value="week">이번 주</option>
            <option value="month">이번 달</option>
          </select>
        </div>

        <!-- Project Folder Connection -->
        <div class="form-group">
          <label class="form-label">연결된 프로젝트 폴더 (Finder/탐색기 바로가기)</label>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="text" id="todoFolderPathInput" class="form-input" style="flex: 1;" placeholder="연결된 폴더 없음" readonly>
            <button id="btnChooseTodoFolder" class="nav-btn" style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;">
              <svg class="icon-svg folder-svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
              폴더 선택
            </button>
            <button id="btnClearTodoFolder" style="border: none; background: none; color: #ef4444; font-size: 16px; cursor: pointer;">&times;</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">메모</label>
          <textarea id="todoNotesInput" class="form-input" rows="2" placeholder="메모 입력"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btnDeleteTodo" class="nav-btn" style="color: #ef4444; display: none;">삭제</button>
        <button id="btnSaveTodo" class="btn-primary" style="margin-left: auto;">저장</button>
      </div>
    </div>
  </div>

  <script src="icons.js"></script>
  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
